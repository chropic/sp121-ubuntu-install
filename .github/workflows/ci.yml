name: repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install shell linter
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Validate repository
        run: scripts/check-repository

      - name: Lint shell scripts
        run: >-
          shellcheck scripts/* tests/* kernel/prepare-tree kernel/build-packages
          system/usr-local-sbin/* system/etc/kernel/postinst.d/*
          system/etc/initramfs/post-update.d/*

      - name: Reject whitespace errors
        # Preserve byte-pinned CRLF manifests and verbatim research/patch inputs.
        run: >-
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol
          show --check --format= -- . ':(exclude)kernel/patches/**'
          ':(exclude)kernel/ports/*/patches/**'
          ':(exclude)kernel/ports/*/research/**'
